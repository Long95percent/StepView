server {
  # 8080 而不是 80：容器以非 root 的 nginx 用户运行，绑不了 1024 以下的端口。
  # 宿主机端口映射不受影响（compose.yaml 里仍是 5173:8080）。
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # 网关同源反代。
  #
  # 前端只发 /api 请求（见 src/browserGatewayApi.js），由这里转给 gateway 容器，
  # 于是网关端口不需要发布到宿主机，浏览器侧也不存在跨域和混合内容问题。
  # proxy_pass 不带路径：/api/board 原样透传成 http://gateway:3210/api/board。
  location /api/ {
    proxy_pass http://gateway:3210;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Agent 聊天是 SSE 流式响应，必须关掉缓冲，否则整段回答生成完才一次性吐出来。
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
