name: Personal macOS release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run dist:personal:mac

      - name: Verify macOS artifacts
        working-directory: release/personal
        run: shasum -a 256 -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: stepview-personal-macos-arm64
          path: |
            release/personal/*.dmg
            release/personal/*.zip
            release/personal/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "StepView Personal $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/personal/*.dmg release/personal/*.zip release/personal/SHA256SUMS.txt --clobber
