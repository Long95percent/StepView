name: stepview

services:
  redis:
    # 固定摘要：tag 会漂，摘要不会。升级方式见 Dockerfile 顶部的说明。
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--protected-mode", "no"]
    restart: unless-stopped
    volumes:
      - ./.stepview-runtime/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  gateway:
    build:
      context: .
      target: gateway
    restart: unless-stopped
    environment:
      STEPVIEW_MODE: family
      STEPVIEW_GATEWAY: local
      STEPVIEW_DATA_DIR: /data
      STEPVIEW_BIND_HOST: 0.0.0.0
      STEPVIEW_HTTP_PORT: 3210
      STEPVIEW_CONTAINERIZED: "true"
      # 默认关闭：注册是整个应用里唯一一个"不需要凭据就能写数据"的入口，
      # 公网部署不该默认开着。加人用 scripts/create-account.js（见 README）。
      # 本地想临时放开：在 .env 里写 STEPVIEW_ALLOW_REGISTRATION=true。
      STEPVIEW_ALLOW_REGISTRATION: ${STEPVIEW_ALLOW_REGISTRATION:-false}
      STEPVIEW_SESSION_TTL_HOURS: ${STEPVIEW_SESSION_TTL_HOURS:-168}
      # 跨域白名单，默认空 = 不发任何 CORS 头。前端经 web 容器同源访问，
      # 正常部署不需要配。只有前端确实在另一个源时才填。
      STEPVIEW_ALLOWED_ORIGINS: ${STEPVIEW_ALLOWED_ORIGINS:-}
      REDIS_URL: redis://redis:6379/0
      MEM0_API_KEY: ${MEM0_API_KEY:-}
      MEM0_BASE_URL: ${MEM0_BASE_URL:-https://api.mem0.ai/v1}
    volumes:
      - ./.stepview-family-data:/data
    # 只在内网可达：浏览器一律经 web 容器的 Nginx 反代访问 /api，
    # 网关端口不发布到宿主机，公网上没有第二个入口。
    expose:
      - "3210"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      target: web
      args:
        # 前端默认走同源 /api（nginx 反代到 gateway），一般留空即可。
        # 只有前端与网关不同源时才需要设置。
        VITE_STEPVIEW_API_URL: ${VITE_STEPVIEW_API_URL:-}
        # 构建前端时装 npm 依赖用的源。国内网络慢就设 NPM_REGISTRY=https://registry.npmmirror.com。
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    ports:
      # 容器里的 web 以非 root 运行，监听 8080（见 docker/nginx.conf）。
      - "${STEPVIEW_BIND_ADDRESS:-127.0.0.1}:5173:8080"
    depends_on:
      gateway:
        condition: service_healthy
